<div>
  <div *ngIf="errorMessage" class="alert-error">
    {{ errorMessage }}
  </div>

  <div class="card">
    <h3>{{ editingUserId ? 'Edit User' : 'Add New User' }}</h3>
    <form (ngSubmit)="saveUser()">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" [(ngModel)]="name" name="userName" placeholder="John Doe" required />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" [(ngModel)]="email" name="userEmail" placeholder="user@example.com" required />
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div class="form-group">
          <label>Password</label>
          <input type="password" [(ngModel)]="password" name="userPassword" [placeholder]="editingUserId ? 'Leave blank to keep current' : '••••••••'" [required]="!editingUserId" />
        </div>
        <div class="form-group">
          <label>Role</label>
          <select [(ngModel)]="role" name="userRole">
            <option value="USER">USER</option>
            <option value="ADMIN">ADMIN</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Interests (comma separated)</label>
        <input type="text" [(ngModel)]="interests" name="userInterests" placeholder="reading, music, gaming" />
      </div>

      <div class="btn-group">
        <button type="submit" class="btn-primary">{{ editingUserId ? 'Update User' : 'Save User' }}</button>
        <button type="button" class="btn-secondary" *ngIf="editingUserId" (click)="cancelEdit()">Cancel</button>
      </div>
    </form>
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h3>Users (Total: {{ total }})</h3>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Interests</th>
            <th style="width: 150px;">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users">
            <td><strong>{{ user.name }}</strong></td>
            <td>{{ user.email }}</td>
            <td><span class="role-tag">{{ user.role }}</span></td>
            <td>{{ (user.interests || []).join(', ') }}</td>
            <td>
              <div class="btn-group">
                <button class="btn-secondary" (click)="editUser(user)">Edit</button>
                <button class="btn-danger" (click)="deleteUser(user.id)">Delete</button>
              </div>
            </td>
          </tr>
          <tr *ngIf="users.length === 0">
            <td colspan="5" style="text-align: center; color: #a0aec0; padding: 24px;">No users found.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <button class="btn-secondary" (click)="prevPage()" [disabled]="page === 0">Prev</button>
      <span>Page {{ page + 1 }}</span>
      <button class="btn-secondary" (click)="nextPage()" [disabled]="(page + 1) * size >= total">Next</button>
    </div>
  </div>
</div>

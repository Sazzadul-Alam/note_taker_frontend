<div class="card" style="max-width: 450px; margin: 40px auto;">
  <h2>{{ isLoginMode ? 'Sign In to Your Account' : 'Create an Account' }}</h2>

  <div *ngIf="errorMessage" class="alert-error">
    {{ errorMessage }}
  </div>

  <form *ngIf="isLoginMode" (ngSubmit)="onLogin()">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" [(ngModel)]="loginEmail" name="loginEmail" placeholder="you@example.com" required />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="loginPassword" name="loginPassword" placeholder="••••••••" required />
    </div>
    <div class="btn-group" style="margin-top: 20px;">
      <button type="submit" class="btn-primary" [disabled]="isLoading">
        <span *ngIf="isLoading" class="spinner"></span>
        <span>{{ isLoading ? 'Signing In...' : 'Sign In' }}</span>
      </button>
      <button type="button" class="btn-secondary" (click)="toggleMode()" [disabled]="isLoading">Register Instead</button>
    </div>
  </form>

  <form *ngIf="!isLoginMode" (ngSubmit)="onRegister()">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" [(ngModel)]="registerName" name="registerName" placeholder="John Doe" required />
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" [(ngModel)]="registerEmail" name="registerEmail" placeholder="you@example.com" required />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="registerPassword" name="registerPassword" placeholder="••••••••" required />
    </div>
    <div class="form-group">
      <label>Role</label>
      <select [(ngModel)]="registerRole" name="registerRole">
        <option value="USER">USER</option>
        <option value="ADMIN">ADMIN</option>
      </select>
    </div>
    <div class="form-group">
      <label>Interests (comma separated)</label>
      <input type="text" [(ngModel)]="registerInterests" name="registerInterests" placeholder="coding, design, music" />
    </div>
    <div class="btn-group" style="margin-top: 20px;">
      <button type="submit" class="btn-primary" [disabled]="isLoading">
        <span *ngIf="isLoading" class="spinner"></span>
        <span>{{ isLoading ? 'Registering...' : 'Register' }}</span>
      </button>
      <button type="button" class="btn-secondary" (click)="toggleMode()" [disabled]="isLoading">Sign In Instead</button>
    </div>
  </form>
</div>

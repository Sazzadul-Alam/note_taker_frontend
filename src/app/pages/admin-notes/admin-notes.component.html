<div>
  <div *ngIf="errorMessage" class="alert-error">
    {{ errorMessage }}
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h3>Admin - All Notes</h3>
      <span style="font-size: 13px; color: #718096;">Total: {{ total }} notes</span>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Note ID</th>
            <th>Owner ID</th>
            <th>Title</th>
            <th>Content</th>
            <th>Created</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let note of notes">
            <td style="font-size: 12px; color: #718096;">{{ note.id }}</td>
            <td style="font-size: 12px; color: #718096;">{{ note.ownerId }}</td>
            <td><strong>{{ note.title }}</strong></td>
            <td>{{ note.content }}</td>
            <td style="color: #718096; font-size: 13px;">{{ note.createdAt | date:'short' }}</td>
          </tr>
          <tr *ngIf="notes.length === 0">
            <td colspan="5" style="text-align: center; color: #a0aec0; padding: 24px;">No notes found.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <button class="btn-secondary" (click)="prevPage()" [disabled]="page === 0">Prev</button>
      <span>Page {{ page + 1 }}</span>
      <button class="btn-secondary" (click)="nextPage()" [disabled]="(page + 1) * size >= total">Next</button>
    </div>
  </div>
</div>
